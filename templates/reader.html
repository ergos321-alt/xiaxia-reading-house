<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#f3ecdf">
  <title>共读小屋 · 阅读</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reader-engine.css') }}">
</head>
<body class="reader-page"
      data-book-id="{{ book_id }}"
      data-reader-engine="pending"
      data-reader-engine-enabled="{{ 'true' if reader_engine_enabled else 'false' }}"
      data-dual-anchor-enabled="{{ 'true' if dual_anchor_enabled else 'false' }}"
      data-text-index-ready="false">
  <header class="reader-toolbar">
    <a class="icon-button reader-back" href="{{ url_for('library_page') }}" aria-label="返回书架">←</a>
    <div class="reader-heading">
      <strong id="reader-book-title">正在打开书籍…</strong>
      <span id="reader-chapter-title"></span>
    </div>
    <button id="reader-menu-button" class="icon-button reader-more-button" type="button" aria-label="打开阅读菜单" aria-expanded="false">···</button>
    <div id="reader-menu" class="reader-menu" hidden>
      <p class="reader-menu-title">书页旁的工具</p>
      <button id="toc-button" class="reader-menu-item" type="button" aria-label="打开目录" aria-expanded="false">章节目录</button>
      <button id="reading-mode" class="reader-menu-item" type="button" aria-label="切换分页或滚动模式">切换为分页阅读</button>
      <a id="annotations-overview-link" class="reader-menu-item" href="{{ url_for('annotations_overview_page', book_id=book_id) }}" aria-label="划线与批注总览">书页痕迹</a>
      <a id="after-reading-link" class="reader-menu-item" href="{{ url_for('memories.after_reading_page', book_id=book_id) }}" aria-label="打开读完以后">读完以后</a>
      <div class="reader-font-control" aria-label="字体大小">
        <span>字体大小</span>
        <div>
          <button id="font-down" class="font-button" type="button" aria-label="缩小字号">A−</button>
          <button id="font-up" class="font-button" type="button" aria-label="放大字号">A＋</button>
        </div>
      </div>
    </div>
  </header>

  <div id="reader-progress" class="reader-progress" aria-hidden="true"><span></span></div>

  <aside id="toc-drawer" class="toc-drawer" aria-hidden="true">
    <div class="toc-header">
      <h2>目录</h2>
      <button id="toc-close" class="icon-button" type="button" aria-label="关闭目录">×</button>
    </div>
    <nav id="toc-list" aria-label="书籍目录"></nav>
  </aside>
  <div id="drawer-scrim" class="drawer-scrim" hidden></div>

  <main class="reader-shell">
    <section id="chapter-thoughts" class="chapter-thoughts" hidden aria-live="polite"></section>
    <article id="chapter-content" class="chapter-content" tabindex="-1" aria-live="polite">
      <p class="reader-loading">正在翻到上次读过的地方…</p>
    </article>
    <section id="finish-book-entry" class="finish-book-entry" hidden>
      <p>这一页已经读到末尾。</p>
      <button id="finish-book-button" type="button">合上正文，翻到读完以后</button>
    </section>
    <button id="page-previous" class="page-turn page-turn-previous" type="button" aria-label="上一页"><span aria-hidden="true">‹</span></button>
    <button id="page-next" class="page-turn page-turn-next" type="button" aria-label="下一页"><span aria-hidden="true">›</span></button>
    <div id="page-status" class="page-status" hidden aria-live="polite"></div>
    <nav class="chapter-navigation" aria-label="章节导航">
      <button id="previous-chapter" type="button">← 上一章</button>
      <span id="chapter-position"></span>
      <button id="next-chapter" type="button">下一章 →</button>
    </nav>
    <p id="foliate-readonly-note" class="foliate-readonly-note" hidden>新书页已可阅读；划线与留句仍由旧书页系统保管</p>
  </main>

  <div id="selection-menu" class="selection-menu" role="toolbar" aria-label="选中文字后的操作" hidden>
    <span class="selection-pencil" aria-hidden="true">✎</span>
    <button id="highlight-selection" type="button">只划线</button>
    <button id="note-selection" type="button">留一句</button>
  </div>

  <dialog id="note-dialog" class="note-dialog">
    <form method="dialog" id="note-form">
      <div class="dialog-heading">
        <h2 id="note-dialog-title">写在书页旁</h2>
        <button class="icon-button" type="button" data-close-note aria-label="关闭">×</button>
      </div>
      <blockquote id="selected-quote"></blockquote>
      <label for="note-text">我的想法</label>
      <textarea id="note-text" rows="5" maxlength="20000" placeholder="也可以暂时留空，只保存划线。"></textarea>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-note>取消</button>
        <button id="save-note" class="primary-button" type="submit" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="annotation-dialog" class="annotation-dialog">
    <form id="annotation-view-form" method="dialog">
      <div class="dialog-heading">
        <p id="annotation-kind" class="eyebrow">书页旁</p>
        <div class="sheet-heading-actions">
          <button id="trace-menu-button" class="icon-button" type="button" aria-label="管理这条阅读痕迹" aria-expanded="false">···</button>
          <button class="icon-button" value="close" aria-label="收起批注纸">×</button>
        </div>
      </div>
      <blockquote id="annotation-quote"></blockquote>
      <div id="trace-record-choices" class="trace-record-choices" hidden></div>
      <section id="user-note-section">
        <h3>🐶 张超</h3>
        <p id="annotation-user-note"></p>
      </section>
      <section id="xiaxia-reply-section">
        <h3>🐱 林知夏</h3>
        <p id="annotation-xiaxia-reply"></p>
      </section>
      <section id="xiaxia-thought-section">
        <h3>🐱 林知夏</h3>
        <p id="annotation-xiaxia-thought"></p>
      </section>
      <section id="thought-user-reply-section" hidden>
        <h3>🐶 张超</h3>
        <p id="thought-user-reply"></p>
      </section>
      <div id="trace-actions-menu" class="trace-actions-menu" hidden>
        <div id="thought-actions" class="trace-action-group" hidden>
          <button id="thought-reply-delete" class="danger-button" type="button">删除回复</button>
          <button id="thought-reply-edit" class="secondary-button" type="button">回复林知夏</button>
        </div>
        <div id="annotation-actions" class="trace-action-group">
          <button id="edit-annotation" class="secondary-button" type="button">编辑</button>
          <button id="delete-annotation" class="danger-button" type="button">删除</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="footnote-dialog" class="footnote-dialog" aria-labelledby="footnote-title">
    <div class="footnote-paper">
      <div class="dialog-heading">
        <h2 id="footnote-title">书页注释</h2>
        <button id="footnote-close" class="icon-button" type="button" aria-label="关闭脚注">×</button>
      </div>
      <div id="footnote-content" class="footnote-content"></div>
      <button id="footnote-open-full" class="secondary-button" type="button" hidden>前往完整注释位置</button>
    </div>
  </dialog>

  <div id="reader-toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!-- Legacy fallback remains static/js/reader.js; the loader only selects an engine. -->
  <script type="module" src="{{ url_for('static', filename='js/reader-engine-loader.js') }}"></script>
</body>
</html>
