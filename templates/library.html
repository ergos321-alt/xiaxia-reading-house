<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ecdf">
  <title>共读小屋 · 书架</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="library-page">
  <header class="site-header">
    <div>
      <p class="eyebrow">Xiaxia Reading House</p>
      <h1>我们的书架</h1>
    </div>
    <div class="header-actions">
      <a class="text-button" href="{{ url_for('annotations_management_page') }}">批注管理</a>
      <form method="post" action="{{ url_for('logout') }}">
        <button class="text-button" type="submit">离开小屋</button>
      </form>
    </div>
  </header>

  <main class="library-main">
    <section id="shared-reading-note" class="shared-reading-note" hidden aria-labelledby="shared-reading-title">
      <div class="shared-note-pin" aria-hidden="true"></div>
      <p id="shared-reading-title" class="shared-note-kicker">最近一起读到这里</p>
      <a id="shared-reading-link" href="#">
        <strong id="shared-reading-book"></strong>
        <span id="shared-reading-chapter"></span>
      </a>
      <div class="shared-note-progress" aria-hidden="true"><span id="shared-reading-progress"></span></div>
      <p id="shared-reading-percentage" class="shared-note-footnote"></p>
    </section>

    <section class="upload-panel" aria-labelledby="upload-title">
      <span class="upload-mark" aria-hidden="true">＋</span>
      <div class="upload-copy">
        <h2 id="upload-title">把一本书带回家</h2>
        <p>支持普通 EPUB2 / EPUB3 与 TXT，单本不超过 {{ max_upload_mb }} MB。</p>
      </div>
      <label class="upload-button" for="book-file">从设备中选一本</label>
      <input id="book-file" type="file" accept=".epub,.txt,application/epub+zip,text/plain" hidden>
      <div id="upload-status" class="upload-status" aria-live="polite"></div>
    </section>

    <section aria-labelledby="shelf-title">
      <div class="section-heading">
        <h2 id="shelf-title">书架</h2>
        <span id="book-count" class="muted"></span>
      </div>
      <div id="bookshelf" class="bookshelf" aria-live="polite"></div>
      <div id="empty-shelf" class="empty-state" hidden>
        <div class="empty-book" aria-hidden="true"></div>
        <h3>书架还是空的</h3>
        <p>上传第一本书，我们从这里开始一起读。</p>
      </div>
    </section>
  </main>

  <template id="book-card-template">
    <article class="book-card">
      <a class="book-cover-link" href="#">
        <div class="book-cover">
          <img alt="" loading="lazy">
          <span class="cover-placeholder" aria-hidden="true">书</span>
        </div>
      </a>
      <div class="book-info">
        <a class="book-title" href="#"></a>
        <p class="book-author"></p>
        <p class="book-readiness-note" hidden></p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <span></span>
        </div>
        <p class="book-progress"></p>
        <div class="book-card-actions">
          <a class="continue-link" href="#">翻开这本书 <span aria-hidden="true">→</span></a>
          <button class="edit-book-button text-button" type="button">编辑信息</button>
          <button class="text-index-button text-button" type="button" hidden></button>
          <button class="delete-book-button text-button" type="button">删除书籍</button>
        </div>
      </div>
    </article>
  </template>

  <dialog id="book-edit-dialog" class="book-edit-dialog">
    <form id="book-edit-form">
      <div class="dialog-heading">
        <h2>编辑书籍信息</h2>
        <button class="icon-button" type="button" data-close-book-edit aria-label="关闭">×</button>
      </div>
      <input id="edit-book-id" type="hidden">
      <label for="edit-book-title">书名</label>
      <input id="edit-book-title" maxlength="1000" required>
      <label for="edit-book-author">作者</label>
      <input id="edit-book-author" maxlength="1000" required>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-book-edit>取消</button>
        <button class="primary-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='js/library.js') }}" defer></script>
</body>
</html>
