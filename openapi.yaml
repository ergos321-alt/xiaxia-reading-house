openapi: 3.1.0
info:
  title: Xiaxia Reading House V1.1 Actions
  version: 1.1.0
  description: Private reading facts and durable Xiaxia-owned reading traces. The server never generates persona text.
servers:
  - url: https://xiaxia-reading-house.onrender.com
security:
  - bearerAuth: []
paths:
  /api/reading/state:
    get:
      operationId: getReadingState
      summary: Get shared reading state
      description: 用于获取当前正在阅读的书、章节和位置。询问当前书或继续阅读时应首先调用此工具，直接使用 current.book.id，不要先枚举整个书架。
      responses:
        "200":
          description: Current reading state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    $ref: "#/components/schemas/ReadingState"
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books:
    get:
      operationId: listBooks
      summary: List private books
      description: 用于搜索或分页浏览书架。不要用此工具确定当前正在阅读的书；当前书应先调用 getReadingState。搜索时传 query，浏览时传 limit 和 offset。
      parameters:
        - name: query
          in: query
          required: false
          description: Optional title or author substring to search for.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Maximum number of lightweight book records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          required: false
          description: Zero-based offset for paginated shelf browsing.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Books on the private shelf.
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
                      has_more:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books/{book_id}/chapters:
    get:
      operationId: listBookChapters
      summary: List chapters in reading order
      description: Get stable chapter IDs for any book without relying on user progress or annotations.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Book UUID from listBooks.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chapters ordered by chapter_index.
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: string
                    format: uuid
                  chapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChapterDirectoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/books/{book_id}/annotations:
    get:
      operationId: listBookAnnotations
      summary: List a book's reading traces
      description: Return user annotations and, with the all filter, Xiaxia Thoughts with exact source anchors.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Book UUID.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Filter user annotations. Thoughts are included with all.
          schema:
            type: string
            enum: [all, highlights, comments, replies]
            default: all
      responses:
        "200":
          description: Filtered reading traces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    type: string
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
                  xiaxia_thoughts:
                    type: array
                    items:
                      $ref: "#/components/schemas/XiaxiaThought"
                  counts:
                    type: object
                    properties:
                      annotations:
                        type: integer
                      xiaxia_thoughts:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reading/context:
    get:
      operationId: getReadingContext
      summary: Read one stable chapter chunk
      description: Read chunk 0 first. If chunk_count is above 1, read every chunk through chunk_count minus 1 before claiming the chapter is complete.
      parameters:
        - name: chapter_id
          in: query
          required: false
          description: Chapter UUID from listBookChapters.
          schema:
            type: string
            format: uuid
        - name: annotation_id
          in: query
          required: false
          description: Focus one user annotation and return the chunk containing it.
          schema:
            type: string
            format: uuid
        - name: chunk_index
          in: query
          required: false
          description: Zero-based chunk index.
          schema:
            type: integer
            minimum: 0
        - name: include_adjacent
          in: query
          required: false
          description: Include adjacent chapter facts when needed.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One chunk with stable blocks used by web anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/annotations/pending:
    get:
      operationId: listPendingAnnotations
      summary: List pending user annotations
      description: Return oldest pending user annotations, optionally limited to one book.
      parameters:
        - name: book_id
          in: query
          required: false
          description: Optional book UUID.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum result count from 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Pending annotations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/annotations/{annotation_id}/seen:
    post:
      operationId: markAnnotationSeen
      summary: Mark a user annotation seen
      description: Move a pending user annotation to seen and persist Xiaxia's last annotation checkpoint.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated annotation state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation:
                    $ref: "#/components/schemas/Annotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/annotations/{annotation_id}/reply:
    post:
      operationId: replyToAnnotation
      summary: Create or replace Xiaxia Reply
      description: Save Xiaxia's reply to one user annotation and set its status to replied.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationReplyInput"
      responses:
        "200":
          description: Durable Xiaxia Reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    $ref: "#/components/schemas/XiaxiaReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAnnotationReply
      summary: Update Xiaxia Reply
      description: Modify only Xiaxia's reply while preserving the user annotation and its anchor.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationReplyInput"
      responses:
        "200":
          description: Updated Xiaxia Reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    $ref: "#/components/schemas/XiaxiaReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAnnotationReply
      summary: Delete Xiaxia Reply
      description: Delete only Xiaxia's reply, keep the user annotation, and return its status to seen.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  annotation_id:
                    type: string
                    format: uuid
                  annotation_status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/xiaxia/thoughts:
    get:
      operationId: listXiaxiaThoughts
      summary: List Xiaxia Thoughts
      description: List Xiaxia-owned Thoughts for one book, optionally one chapter, with stable anchors and pagination.
      parameters:
        - name: book_id
          in: query
          required: true
          description: Book UUID.
          schema:
            type: string
            format: uuid
        - name: chapter_id
          in: query
          required: false
          description: Optional chapter UUID within the book.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Results per page from 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated Xiaxia Thoughts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thoughts:
                    type: array
                    items:
                      $ref: "#/components/schemas/XiaxiaThought"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createXiaxiaThought
      summary: Create one Xiaxia Thought
      description: Save one exact range, block, or chapter Thought. Range text must match the supplied stable block offsets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThoughtInput"
      responses:
        "201":
          description: Created Xiaxia Thought.
          content:
            application/json:
              schema:
                type: object
                properties:
                  xiaxia_thought:
                    $ref: "#/components/schemas/XiaxiaThought"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/xiaxia/thoughts/{thought_id}:
    patch:
      operationId: updateXiaxiaThought
      summary: Update one Xiaxia Thought
      description: Modify Thought content or mark type. Anchor changes are accepted only after exact block and offset validation.
      parameters:
        - name: thought_id
          in: path
          required: true
          description: Xiaxia Thought UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThoughtUpdateInput"
      responses:
        "200":
          description: Updated Xiaxia Thought.
          content:
            application/json:
              schema:
                type: object
                properties:
                  xiaxia_thought:
                    $ref: "#/components/schemas/XiaxiaThought"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteXiaxiaThought
      summary: Delete one Xiaxia Thought
      description: Delete only a Xiaxia-owned Thought. A linked user reply is removed by the same transaction.
      parameters:
        - name: thought_id
          in: path
          required: true
          description: Xiaxia Thought UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  thought_id:
                    type: string
                    format: uuid
                  deleted_user_reply:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/xiaxia/thoughts/batch-delete:
    post:
      operationId: deleteXiaxiaThoughts
      summary: Delete Xiaxia Thoughts by scope
      description: Delete only Xiaxia-owned Thoughts for one book and optional chapter. User annotations are never targeted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: string
                  format: uuid
                chapter_id:
                  type: string
                  format: uuid
              required: [book_id]
      responses:
        "200":
          description: Deleted Thought IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer
                  thought_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/xiaxia/thoughts/preview:
    post:
      operationId: previewXiaxiaThoughts
      summary: Validate Thought candidates
      description: Validate 1 to 50 exact candidates and return candidate IDs. Preview never creates formal Thoughts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/ThoughtInput"
              required: [candidates]
      responses:
        "200":
          description: Candidate validation results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThoughtCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/xiaxia/thoughts/commit:
    post:
      operationId: commitXiaxiaThoughts
      summary: Commit validated Thought candidates
      description: Batch commit valid unexpired candidates. Each candidate returns its own committed or failed result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
              required: [candidate_ids]
      responses:
        "200":
          description: Per-candidate commit results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommitResult"
                  committed_count:
                    type: integer
                  failed_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/ai/progress:
    post:
      operationId: saveAiProgress
      summary: Save Xiaxia reading checkpoint
      description: Save a chapter chunk checkpoint. Completion requires the final chunk; a stale final block is normalized to the final legal block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: string
                  format: uuid
                chapter_id:
                  type: string
                  format: uuid
                chunk_index:
                  type: integer
                  minimum: 0
                chunk_id:
                  type: string
                last_block_id:
                  type: string
                last_annotation_seen:
                  type: string
                  format: uuid
                chapter_completed:
                  type: boolean
              required: [book_id]
      responses:
        "200":
          description: Persisted Xiaxia checkpoint.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai_reading_state:
                    $ref: "#/components/schemas/AiProgress"
                  last_block_normalized:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/actions/undo:
    post:
      operationId: undoLastReadingAction
      summary: Undo Xiaxia's latest trace operation
      description: Undo the latest Xiaxia Thought or Reply create, update, delete, or batch operation unless later changes conflict.
      responses:
        "200":
          description: Undone operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone:
                    type: boolean
                  operation:
                    $ref: "#/components/schemas/OperationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ACTION_API_TOKEN
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Action bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The target changed or cannot be undone safely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        format:
          type: string
        chapter_count:
          type: integer
        progress_percentage:
          type: number
    ChapterDirectoryItem:
      type: object
      properties:
        chapter_id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        title:
          type: string
        word_count:
          type: integer
    StableBlock:
      type: object
      properties:
        block_id:
          type: string
        block_order:
          type: integer
        start_offset:
          type: integer
        end_offset:
          type: integer
        text:
          type: string
    Anchor:
      type: object
      properties:
        scope:
          type: string
        start_block_id:
          type: [string, "null"]
        start_offset:
          type: [integer, "null"]
        end_block_id:
          type: [string, "null"]
        end_offset:
          type: [integer, "null"]
        selected_text:
          type: string
    Annotation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        selected_text:
          type: string
        start_block_id:
          type: string
        start_offset:
          type: integer
        end_block_id:
          type: string
        end_offset:
          type: integer
        comment:
          type: string
        status:
          type: string
        owner:
          type: string
        content_type:
          type: string
        xiaxia_response:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    XiaxiaThought:
      type: object
      properties:
        id:
          type: string
          format: uuid
        thought_id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        scope:
          type: string
        mark_type:
          type: string
        content:
          type: string
        thought_content:
          type: string
        selected_text:
          type: string
        start_block_id:
          type: [string, "null"]
        start_offset:
          type: [integer, "null"]
        end_block_id:
          type: [string, "null"]
        end_offset:
          type: [integer, "null"]
        owner:
          type: string
        content_type:
          type: string
        user_response:
          type: [string, "null"]
        anchor:
          $ref: "#/components/schemas/Anchor"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    XiaxiaReply:
      type: object
      properties:
        id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
        response:
          type: string
        owner:
          type: string
        content_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AnnotationReplyInput:
      type: object
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 50000
      required: [response]
    ThoughtInput:
      type: object
      properties:
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [range, block, chapter]
        mark_type:
          type: string
          default: thought
        content:
          type: string
          maxLength: 50000
        block_id:
          type: string
        selected_text:
          type: string
        start_block_id:
          type: string
        start_offset:
          type: integer
          minimum: 0
        end_block_id:
          type: string
        end_offset:
          type: integer
          minimum: 0
      required: [book_id, chapter_id, scope, content]
    ThoughtUpdateInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 50000
        mark_type:
          type: string
        scope:
          type: string
          enum: [range, block, chapter]
        block_id:
          type: string
        selected_text:
          type: string
        start_block_id:
          type: string
        start_offset:
          type: integer
          minimum: 0
        end_block_id:
          type: string
        end_offset:
          type: integer
          minimum: 0
    ThoughtCandidate:
      type: object
      properties:
        candidate_id:
          type: string
          format: uuid
        validation_status:
          type: string
          enum: [valid, invalid]
        validation_error:
          type: [string, "null"]
        matched_text:
          type: string
        anchor:
          $ref: "#/components/schemas/Anchor"
    CommitResult:
      type: object
      properties:
        candidate_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [committed, failed]
        thought_id:
          type: string
          format: uuid
        error:
          type: string
    ChapterChunk:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        title:
          type: string
        word_count:
          type: integer
        chunk_index:
          type: integer
        chunk_id:
          type: string
        chunk_count:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean
        chunk_text:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/StableBlock"
