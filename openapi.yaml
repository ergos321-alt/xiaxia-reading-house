openapi: 3.1.0
info:
  title: Xiaxia Reading House V1 Actions
  version: 1.1.0
  description: Private reading facts and durable co-reading state. The server never generates Xiaxia persona text.
servers:
  - url: https://xiaxia-reading-house.onrender.com
security:
  - bearerAuth: []
paths:
  /api/reading/state:
    get:
      operationId: getReadingState
      summary: Get the current shared reading state
      description: Restore the active book, user position, Xiaxia chunk checkpoint, and pending count.
      responses:
        "200":
          description: Current reading state. The current property is absent or null when the shelf has no progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    $ref: "#/components/schemas/ReadingState"
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books:
    get:
      operationId: listBooks
      summary: List books on the private shelf
      description: Return book IDs and reading summaries. Use a book ID to list its ordered chapters.
      responses:
        "200":
          description: Ordered bookshelf entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books/{book_id}/chapters:
    get:
      operationId: listBookChapters
      summary: List a book's chapters in reading order
      description: Get stable chapter IDs before choosing any chapter. This does not depend on user progress or annotations.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Book UUID from listBooks.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chapters ordered by chapter_index.
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: string
                    format: uuid
                  chapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChapterDirectoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/books/{book_id}/annotations:
    get:
      operationId: listBookAnnotations
      summary: List a book's annotation overview
      description: Return user annotations and, for the all filter, independent Xiaxia thoughts with exact source anchors.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Book UUID.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: Filter user annotations. Independent thoughts are included only with all.
          schema:
            type: string
            enum: [all, highlights, comments, replies]
            default: all
      responses:
        "200":
          description: Filtered annotations and independent thoughts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    type: string
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
                  xiaxia_thoughts:
                    type: array
                    items:
                      $ref: "#/components/schemas/XiaxiaThought"
                  counts:
                    type: object
                    properties:
                      annotations:
                        type: integer
                      xiaxia_thoughts:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/reading/context:
    get:
      operationId: getReadingContext
      summary: Read one stable chapter chunk
      description: Read chunk 0 first unless focusing an annotation. If chunk_count is above 1, read every chunk through chunk_count minus 1 before claiming the chapter is complete.
      parameters:
        - name: chapter_id
          in: query
          required: false
          description: Chapter UUID from listBookChapters.
          schema:
            type: string
            format: uuid
        - name: annotation_id
          in: query
          required: false
          description: Focus a user annotation and use its chapter. The response identifies its chunk.
          schema:
            type: string
            format: uuid
        - name: chunk_index
          in: query
          required: false
          description: Zero-based chunk to read. Omit for chunk 0 or the focused annotation's chunk.
          schema:
            type: integer
            minimum: 0
        - name: include_adjacent
          in: query
          required: false
          description: Include previous and next chapter facts only when needed.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One chapter chunk with the exact stable blocks used by web annotations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    $ref: "#/components/schemas/ContextBook"
                  chapter:
                    $ref: "#/components/schemas/ChapterChunk"
                  reading_progress:
                    $ref: "#/components/schemas/UserProgress"
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
                  xiaxia_thoughts:
                    type: array
                    items:
                      $ref: "#/components/schemas/XiaxiaThought"
                  focus_annotation:
                    $ref: "#/components/schemas/Annotation"
                  focus_annotation_chunk_index:
                    type: integer
                  reading_instruction:
                    type: string
                  adjacent_chapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdjacentChapter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/annotations/pending:
    get:
      operationId: listPendingAnnotations
      summary: List unprocessed user annotations
      description: Return the oldest pending user annotations, optionally for one book.
      parameters:
        - name: book_id
          in: query
          required: false
          description: Optional book UUID.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum results.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Oldest pending annotations first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/annotations/{annotation_id}:
    patch:
      operationId: updateAnnotation
      summary: Edit a user's annotation comment
      description: Update only the comment. Existing block IDs, offsets, selected text, and reply remain unchanged.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          description: Updated annotation with the original anchor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation:
                    $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAnnotation
      summary: Delete a user annotation and its reply
      description: Delete atomically. If xiaxia_response exists, obtain explicit user confirmation first; the attached reply is cascade-deleted.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion result and whether a reply was also removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  annotation_id:
                    type: string
                    format: uuid
                  deleted_reply:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/annotations/{annotation_id}/seen:
    post:
      operationId: markAnnotationSeen
      summary: Mark a user annotation as seen
      description: Record that Xiaxia read the annotation without writing a reply.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated annotation status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation:
                    $ref: "#/components/schemas/AnnotationState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/annotations/{annotation_id}/reply:
    post:
      operationId: replyToAnnotation
      summary: Write Xiaxia's reply to a user annotation
      description: Persist text supplied by Xiaxia. The server stores it and does not generate persona content.
      parameters:
        - name: annotation_id
          in: path
          required: true
          description: User annotation UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  minLength: 1
                  maxLength: 50000
      responses:
        "200":
          description: Durable reply and replied status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    $ref: "#/components/schemas/AnnotationReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/xiaxia/thoughts:
    post:
      operationId: createXiaxiaThought
      summary: Create an independent Xiaxia thought
      description: Store Xiaxia-supplied text at a precise range, whole block, or chapter. Use block IDs and offsets returned by getReadingContext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id, chapter_id, scope, content]
              properties:
                book_id:
                  type: string
                  format: uuid
                chapter_id:
                  type: string
                  format: uuid
                scope:
                  type: string
                  enum: [range, block, chapter]
                mark_type:
                  type: string
                  maxLength: 64
                  description: Optional future-facing kind such as thought, like, question, or discuss.
                content:
                  type: string
                  minLength: 1
                  maxLength: 50000
                block_id:
                  type: string
                  description: Required for block scope.
                start_block_id:
                  type: string
                  description: Required for range scope.
                start_offset:
                  type: integer
                  minimum: 0
                end_block_id:
                  type: string
                  description: Required for range scope.
                end_offset:
                  type: integer
                  minimum: 0
                selected_text:
                  type: string
                  maxLength: 20000
                  description: Optional exact check against the supplied range.
      responses:
        "201":
          description: Stored independent thought with its exact anchor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  xiaxia_thought:
                    $ref: "#/components/schemas/XiaxiaThought"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/ai/progress:
    post:
      operationId: saveAiProgress
      summary: Persist Xiaxia's chunk checkpoint
      description: Save the last chapter chunk and block read. Set chapter_completed true only after reading the final chunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id:
                  type: string
                  format: uuid
                chapter_id:
                  type: string
                  format: uuid
                chunk_index:
                  type: integer
                  minimum: 0
                last_block_id:
                  type: string
                last_annotation_seen:
                  type: string
                  format: uuid
                chapter_completed:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Persisted checkpoint recoverable through getReadingState.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai_reading_state:
                    $ref: "#/components/schemas/AiProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested private reading resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        format:
          type: string
          enum: [epub, txt]
        source_filename:
          type: string
        chapter_count:
          type: integer
        progress_chapter_id:
          type: string
          format: uuid
        progress_chapter_index:
          type: integer
        progress_percentage:
          type: number
        current_chapter:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChapterDirectoryItem:
      type: object
      required: [chapter_id, chapter_index, title, word_count]
      properties:
        chapter_id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        title:
          type: string
        word_count:
          type: integer
    ContextBook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        chapter_count:
          type: integer
    StableBlock:
      type: object
      required: [block_id, block_order, text]
      properties:
        block_id:
          type: string
        block_order:
          type: integer
        start_offset:
          type: integer
        end_offset:
          type: integer
        text:
          type: string
    ChapterChunk:
      type: object
      required: [id, chapter_index, title, chunk_index, chunk_count, has_next, has_previous, chunk_text, blocks]
      properties:
        id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        title:
          type: string
        word_count:
          type: integer
        chunk_index:
          type: integer
        chunk_count:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean
        chunk_text:
          type: string
        chunk_character_count:
          type: integer
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/StableBlock"
        is_complete_chapter:
          type: boolean
        full_text:
          type: string
          description: Present only when the complete short chapter fits in one chunk.
    UserProgress:
      type: object
      properties:
        chapter_id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        percentage:
          type: number
        position:
          $ref: "#/components/schemas/ReadingPosition"
        updated_at:
          type: string
          format: date-time
    ReadingPosition:
      type: object
      properties:
        block_id:
          type: string
        char_offset:
          type: integer
        scroll_fraction:
          type: number
        display_mode:
          type: string
          enum: [scroll, paginated]
        page_index:
          type: integer
        page_count:
          type: integer
    Annotation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        selected_text:
          type: string
        start_block_id:
          type: string
        start_offset:
          type: integer
        end_block_id:
          type: string
        end_offset:
          type: integer
        prefix_text:
          type: string
        suffix_text:
          type: string
        comment:
          type: string
        status:
          type: string
          enum: [pending, seen, replied]
        xiaxia_response:
          type: string
        chapter_title:
          type: string
        chapter_index:
          type: integer
        book_title:
          type: string
        book_author:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    XiaxiaThought:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [range, block, chapter]
        mark_type:
          type: string
        content:
          type: string
        selected_text:
          type: string
        start_block_id:
          type: string
        start_offset:
          type: integer
        end_block_id:
          type: string
        end_offset:
          type: integer
        prefix_text:
          type: string
        suffix_text:
          type: string
        chapter_title:
          type: string
        chapter_index:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AnnotationState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    AnnotationReply:
      type: object
      properties:
        id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
        response:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AiProgress:
      type: object
      properties:
        book_id:
          type: string
          format: uuid
        last_chapter_read:
          type: string
          format: uuid
        last_chunk_index:
          type: integer
        last_block_id:
          type: string
        chapter_completed:
          type: boolean
        last_annotation_seen:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
    ReadingState:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/Book"
        user_progress:
          type: object
          properties:
            chapter_id:
              type: string
              format: uuid
            chapter_index:
              type: integer
            chapter_title:
              type: string
            percentage:
              type: number
            position:
              $ref: "#/components/schemas/ReadingPosition"
            updated_at:
              type: string
              format: date-time
        xiaxia_progress:
          $ref: "#/components/schemas/AiProgress"
        pending_annotation_count:
          type: integer
    AdjacentChapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chapter_index:
          type: integer
        title:
          type: string
        full_text:
          type: string
        word_count:
          type: integer
